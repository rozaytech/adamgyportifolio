<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito — Adamgy Tembe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 48px 40px;
            position: relative;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--text-dim), var(--text));
        }
        .login-logo {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }
        .login-sub {
            font-size: 0.8125rem;
            color: var(--text-dim);
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .login-field {
            margin-bottom: 16px;
        }
        .login-field label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            margin-bottom: 8px;
        }
        .login-field input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.9375rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .login-field input:focus {
            border-color: var(--text-muted);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--text);
            color: var(--bg);
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 8px;
        }
        .login-btn:hover {
            opacity: 0.85;
        }
        .login-error {
            color: #ef4444;
            font-size: 0.8125rem;
            margin-top: 16px;
            display: none;
            padding: 12px;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 6px;
        }
        .login-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 32px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.3s;
        }
        .login-back:hover { color: var(--text); }
        @media (max-width: 480px) {
            .login-card { padding: 36px 24px; }
        }
    </style>
</head>
<body class="login-body">
    <div>
        <div class="login-card">
            <div class="login-logo">Área Restrita</div>
            <p class="login-sub">Portfólio — Admin</p>
            <form id="loginForm">
                <div class="login-field">
                    <label>Utilizador</label>
                    <input type="text" id="user" required autocomplete="username" placeholder="admin ou adamgy">
                </div>
                <div class="login-field">
                    <label>Palavra-passe</label>
                    <input type="password" id="pass" required autocomplete="current-password" placeholder="••••••••">
                </div>
                <button type="submit" class="login-btn">Entrar</button>
                <div id="error" class="login-error">Acesso negado. Verifique as credenciais.</div>
            </form>
        </div>
        <a href="/" class="login-back">← Voltar ao portfólio</a>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            const u = document.getElementById('user').value.trim().toLowerCase();
            const p = document.getElementById('pass').value.trim();
            if((u === 'admin' || u === 'adamgy') && p === 'adamgy2026') {
                localStorage.clear();
                localStorage.setItem('adamgy_auth', 'true');
                localStorage.setItem('adamgy_user', u.charAt(0).toUpperCase() + u.slice(1));
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('error').style.display = 'block';
            }
        };
    </script>
</body>
</html>
